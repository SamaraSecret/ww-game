<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noir Syndicate</title>
<meta name="description" content="A text-based multiplayer underworld crime game.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://gmkpyzazzwwigmxytfgn.supabase.co; base-uri 'none'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="auth" class="auth hidden">
  <div class="auth-box">
    <img class="auth-banner" src="assets/brand/banner.webp" alt="A white rose and a fedora on a rainy night street overlooking a dark city" width="640" height="360">
    <div class="auth-title">
      <img class="auth-emblem" src="assets/brand/emblem.webp" alt="" width="72" height="72">
      <div>
        <h1>NOIR SYNDICATE</h1>
        <p class="tag">A text-based underworld crime game</p>
      </div>
    </div>
    <div class="tabs">
      <button id="tab-login" class="tab active" type="button">Player login</button>
      <button id="tab-register" class="tab" type="button">Register</button>
    </div>
    <form id="auth-form" autocomplete="on">
      <p id="auth-hint" class="muted">Welcome back.</p>
      <label>Username <input id="auth-user" name="username" autocomplete="username" maxlength="16" required></label>
      <label>Password <input id="auth-pass" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required></label>
      <button id="auth-submit" class="btn primary" type="submit">Log in</button>
      <p id="auth-msg" class="msg"></p>
    </form>
    <p class="small muted">Do not reuse a password from another site.</p>
  </div>
</div>

<div id="game" class="hidden">
  <header class="topbar">
    <button id="menu-btn" class="menu-btn" type="button" aria-label="Menu">&#9776;</button>
    <img class="logo-mark" src="assets/brand/emblem.webp" alt="" width="28" height="28">
    <span class="logo">NOIR SYNDICATE</span>
    <span id="top-user" class="top-user"></span>
  </header>
  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="statbox">
        <div class="who"><b id="sb-name"></b> <span id="sb-rank" class="muted"></span></div>
        <div class="row"><span>Level</span><b id="sb-level"></b></div>
        <div class="row"><span>Stat points</span><b id="sb-pts"></b></div>
        <div class="row"><span>Dirty cash</span><b id="sb-dirty" class="money"></b></div>
        <div class="row"><span>Clean cash</span><b id="sb-clean" class="money"></b></div>
        <div class="row"><span>Status</span><b id="sb-status"></b></div>
        <div class="bar-label"><span>Energy</span><span id="sb-energy-t"></span></div>
        <div class="bar"><div id="sb-energy" class="fill energy"></div></div>
        <div class="bar-label"><span>Nerve</span><span id="sb-nerve-t"></span></div>
        <div class="bar"><div id="sb-nerve" class="fill nerve"></div></div>
        <div class="bar-label"><span>Health</span><span id="sb-hp-t"></span></div>
        <div class="bar"><div id="sb-hp" class="fill hp"></div></div>
        <div class="bar-label"><span>XP</span><span id="sb-xp-t"></span></div>
        <div class="bar"><div id="sb-xp" class="fill xp"></div></div>
      </div>
      <nav id="nav" class="nav"></nav>
    </aside>
    <main id="main" class="main"></main>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="vendor/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
